name: Build star data and deploy to GitHub Pages

on:
  push:
    # the repository's default branch (the work happens there; no main branch)
    branches: [claude/stellar-environment-3d-4hemgg, main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Download all catalogues again (ignore the cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # a slow catalogue server may take long; what is downloaded is kept in the cache for the next run
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      # Raw catalogue downloads are cached between runs (the newest copy is restored); bump the
      # key prefix to force a refresh.
      - name: Restore catalogue cache
        if: ${{ !inputs.refresh }}
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: catalogues-v1-${{ hashFiles('pipeline/galmap/sources/*.py') }}-${{ github.run_id }}
          restore-keys: |
            catalogues-v1-${{ hashFiles('pipeline/galmap/sources/*.py') }}-
            catalogues-v1-

      # Any step that fails stops the run before the deploy: the site online stays as it was
      # (a source that is down must not publish a map without its planets or galaxies).
      - name: Build star data
        working-directory: pipeline
        run: python -m galmap.build --out ../public/data

      # Sanity checks against known stars (exit code 1 on a problem).
      - name: Verify star data
        working-directory: pipeline
        run: python -m galmap.verify ../public/data

      # Planets (docs/PLANETS.md): their hosts are found among the stars just built.
      - name: Build planet data
        working-directory: pipeline
        run: python -m galmap.planets --data ../public/data

      # Galaxies (docs/GALAXIES.md).
      - name: Build galaxy data
        working-directory: pipeline
        run: python -m galmap.galaxies --out ../public/data

      # Saved also when a step failed, so that the next run does not download everything again.
      - name: Save catalogue cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: pipeline/cache
          key: catalogues-v1-${{ hashFiles('pipeline/galmap/sources/*.py') }}-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
