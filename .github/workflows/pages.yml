name: Build star data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Download all catalogues again (ignore the cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      # Raw catalogue downloads are cached between runs; bump the key suffix to force a refresh.
      - name: Restore catalogue cache
        if: ${{ !inputs.refresh }}
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: catalogues-v1-${{ hashFiles('pipeline/galmap/sources/*.py') }}
          restore-keys: catalogues-v1-

      - name: Build star data
        working-directory: pipeline
        run: python -m galmap.build --out ../public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
